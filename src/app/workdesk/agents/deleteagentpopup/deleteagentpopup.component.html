<div class="grid-x" style="text-align: center; ">
    <div class="cell large-12" style="text-align: end;">
      <span class="material-icons closebtn" mat-button [mat-dialog-close]="true" cdkFocusInitial>
        close
        </span>
    </div>
  </div>
<div class="grid-x grid-margin-x">
  <div class="cell large-12">
    <p class="heading">Are you sure you want to delete this agent?</p>
    </div>
</div>
 <div class="grid-x grid-margin-x" style="margin-top: 12px; padding-left: 48px; padding-left: 48px;">

<div class="cell large-12">
<p class="descp">Deleting this agent will remove the agent from this integration.</p>
</div>
<div class="cell large-12" style="margin-top: 22px;">
<img src="../../../../assets/gigaaa_logo.png" height="36" width="36"  alt="">
<div style="vertical-align: middle; display: inline-block; margin-left: 12px;">
<p class="fullname">{{agentfullname}}</p>
<p class="agentname">{{agentdisplayname}}</p>
</div>
</div>
<div class="cell large-12" style="margin-top: 24px; text-align: center;">
<button class="yes" (click)="setdeleteagent()">Yes</button>
<button class="cancel" [mat-dialog-close]="true" >Cancel</button>
</div>
 </div>
